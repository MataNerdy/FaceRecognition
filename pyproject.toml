[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-recognition-pipeline"
version = "0.1.0"
description = "PyTorch face recognition pipeline with landmarks, alignment, metric learning and Identification Rate evaluation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "opencv-python>=4.8",
    "Pillow>=10.0",
    "scikit-learn>=1.3",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
