[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "face-recognition-pipeline"
version = "0.1.0"
description = "PyTorch face recognition pipeline with landmarks, alignment, metric learning and Identification Rate evaluation"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch==2.2.2",
    "torchvision==0.17.2",
    "numpy==1.26.4",
    "matplotlib==3.8.4",
    "opencv-python==4.9.0.80",
    "Pillow==10.4.0",
    "scikit-learn==1.4.2",
    "tqdm==4.66.4",
    "facenet-pytorch==2.5.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
